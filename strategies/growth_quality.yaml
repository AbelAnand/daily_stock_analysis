# Growth Quality Strategy

name: growth_quality
display_name: Growth Quality
description: Combines revenue/profit growth, ROE, cash flow, and industry headroom to identify high-quality growth stocks and the risk of a growth stall.
category: framework
core_rules: [2, 3, 5]
required_tools:
  - get_stock_info
  - get_realtime_quote
  - search_stock_news
  - analyze_trend
aliases: [growth, growth stock, growth quality]
default_priority: 55
market_regimes: [trending_up]

instructions: |
  **Growth Quality Strategy**

  Applicable scenarios:
  - Focuses on the company's medium- to long-term growth capacity, not just short-term technical patterns.
  - Suited to companies in high-growth industries, with sustained earnings improvement, or an expanding business model.

  Analysis framework:

  1. **Growth**
     - Prioritize the revenue, net profit attributable to parent, operating cash flow, and ROE fields
       from the financial reports.
     - Judge whether revenue growth and profit growth move together, or whether there's "revenue growth
       without profit growth."
     - If there's only conceptual hype not yet verified by the financial reports, lower the growth-certainty rating.

  2. **Quality**
     - The higher and more stable ROE is, the better the quality.
     - Operating cash flow moving in the same direction as net profit indicates more reliable earnings quality.
     - When cash flow is significantly weaker than profit, flag receivables, inventory, or collection risk.

  3. **Valuation tolerance**
     - Use PE/PB, market cap, and other valuation fields to judge whether the market has already
       front-run the growth.
     - High growth can support a higher valuation, but you must state whether growth can cover that valuation.
     - When valuation is high and growth is slowing, meaningfully lower the score.

  4. **Trend confirmation**
     - Use `analyze_trend` to judge whether the long-term growth thesis has been confirmed by market money flow.
     - When fundamentals are improving but the technicals haven't confirmed it, prefer watch conditions
       over chasing a buy directly.

  Output requirements:
  - State clearly whether the company is: high-quality growth / growth being verified / growth slowing /
    growth thesis disproven.
  - State whether the growth comes from revenue expansion, margin improvement, industry tailwinds, or
    one-off factors.
  - Give buy points suited to growth stocks: a breakout after results are verified, a pullback to a
    long-term moving average, or a valuation pullback.

  Suggested score adjustments:
  - Revenue, profit, cash flow, and ROE all improving together: `sentiment_score +15`
  - Industry tailwinds and company news mutually confirming: an additional `+6`
  - High valuation but growth not yet verified: `sentiment_score -8`
  - Revenue growth without profit growth, or deteriorating cash flow: `sentiment_score -12`
