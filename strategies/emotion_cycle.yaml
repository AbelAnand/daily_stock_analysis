# Sentiment Cycle Strategy
# Uses market sentiment, turnover rate and volume pattern to time entries against crowd behavior.

name: emotion_cycle
display_name: Sentiment Cycle
description: Uses market sentiment, turnover rate, and volume/price structure to identify sentiment lows (panic bottoms) and sentiment highs (euphoric tops), positioning against the crowd.
category: framework
core_rules: [1, 2, 3, 5]
required_tools:
  - get_daily_history
  - get_realtime_quote
  - analyze_trend
  - search_stock_news
aliases: [sentiment, sentiment cycle]
default_priority: 100
market_regimes: [sector_hot]

instructions: |
  **Sentiment Cycle Strategy**

  Core philosophy: market participants' sentiment cycles through
  "panic -> pessimism -> doubt -> hope -> optimism -> excitement -> greed -> euphoria."
  Smart money positions at the panic bottom and exits at the euphoric top.

  ## Quantifying the sentiment phase

  ### Step 1: Turnover-rate analysis (the core sentiment-heat metric)
  Use `get_daily_history` and `get_realtime_quote`:

  - **Turnover < 0.5%/day**: the market is cold, nobody is watching — a potential bottom zone (be greedy when others are fearful).
  - **Turnover 0.5%-2%**: normal trading, sentiment is steady.
  - **Turnover 2%-5%**: active, the market is starting to notice — don't chase strength.
  - **Turnover > 5%**: high heat, hot money/retail is flooding in — watch for a sentiment top.
  - **Turnover > 10% (daily average)**: extremely overheated, usually a short-term top.

  ### Step 2: The trailing turnover-rate trend
  Use `get_daily_history` to compute the turnover trend over the last 20 days:
  - Trending down (steadily cooling) + shrinking volume -> sentiment is receding, wait patiently.
  - Trending up (accelerating) + sharply rising volume -> sentiment is igniting, can consider entering.
  - A sudden single-day volume spike (turnover more than 5x the recent average) -> often a sign of
    distribution by large holders; be cautious.

  ### Step 3: News-sentiment analysis
  Use `search_stock_news` to search recent news and gauge sentiment tilt:
  - News clustering around "good news priced in, earnings beat, limit-up, institutional recommendations" ->
    sentiment may be overheating.
  - News clustering around "earnings decline, bad news, broke support" -> pessimism may be forming a bottom.
  - Extremely negative sentiment on retail forums/social media -> a contrarian indicator, possibly near a bottom.

  ### Step 4: Moving-average contraction and volatility
  Use `analyze_trend`:
  - MA5/MA10/MA20 converging (moving averages contracting) -> coiling, direction undecided, sentiment is cold.
  - Volatility drops to a low level (ATR contracting) -> sentiment is extremely subdued, a precursor to a coiled breakout.

  ## Sentiment-bottom characteristics (buy zone)
  Meets 3 or more of the following:
  - Turnover over the last 20 days sits near a one-year low
  - Volume has been shrinking steadily, more than 50% below the 60-day average
  - Recent news is mostly low-key, neutral, or negative
  - Price is near or below MA20, but without a panic crash
  - Institutional holdings are stable or slightly increasing (if data is available)

  ## Sentiment-top characteristics (trim zone)
  Meets 3 or more of the following:
  - Turnover over the last 5 days > 2x the 20-day average
  - Volume surges in pulses (single-day spikes)
  - News is mostly "good news priced in," sharp institutional target-price upgrades, retail piling in
  - Price is more than 8% away from MA5 (high bias)
  - MACD shows top divergence

  ## Output requirements
  - Current sentiment-phase verdict: cold bottom / steady / warming entry / overheated caution / euphoric top.
  - Compare the current turnover rate against the one-year average turnover rate.
  - Whether the sentiment-bottom or sentiment-top characteristics are met (list which criteria are satisfied).
  - Give a contrarian recommendation (be greedy when the crowd is fearful, be cautious when the crowd is greedy).

  Suggested score adjustments:
  - 3+ sentiment-bottom characteristics met: `sentiment_score +14`
  - All 5 sentiment-bottom characteristics met: `sentiment_score +20`
  - 3+ sentiment-top characteristics met: `sentiment_score -12`
  - All 5 sentiment-top characteristics met: `sentiment_score -20`
  - Steady sentiment range: no adjustment to the base score
