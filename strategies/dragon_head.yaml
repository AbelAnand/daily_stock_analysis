# Dragon Head Strategy
# Identifies sector leaders during sector rotation cycles.

name: dragon_head
display_name: Dragon Head
description: Identifies the sector leader during sector rotation. Applicable when a sector is heating up or an industry catalyst appears.
category: trend
core_rules: [2, 7]
required_tools:
  - get_realtime_quote
  - get_sector_rankings
  - search_stock_news
aliases: [dragon head, sector leader strategy]
default_priority: 90
market_regimes: [sector_hot]

instructions: |
  **Dragon Head Strategy**

  Evaluation criteria:

  1. **Sector-leading position**:
     - Use `get_sector_rankings` to check whether the stock's sector is among the recent top gainers.
     - Confirm whether the stock was first to rally or hit the daily limit-up when the sector started moving.

  2. **Turnover rate and momentum** (relates to core rule 7: relax the threshold for strong trending stocks):
     - Use `get_realtime_quote` to check the turnover rate. A dragon-head stock's turnover is usually > 5%.
     - A volume ratio > 1.5 indicates active trading interest.

  3. **Relative strength**:
     - Compare the stock's gain/loss against the sector average.
     - A true dragon head should outperform the sector by 2%+ on up days.

  4. **News catalyst**:
     - Use `search_stock_news` to search for sector-level catalysts (policy, events, earnings).
     - Dragon-head moves are often accompanied by a sector-wide catalyst.

  5. **Bias check** (relates to core rule 1: strict entry):
     - A dragon-head stock can tolerate a somewhat wider bias, up to 7%, but above 10% still calls for caution.

  Suggested score adjustments:
  - Confirmed as a dragon-head stock: sentiment_score +10
  - The sector is in an active rotation phase: an additional +5
  - Note the "dragon head" verdict in `buy_reason`.
