instructions: |
  **Elliott Wave Theory**

  Core principle: the market moves in a repeating cycle of a 5-wave impulse plus a 3-wave correction.

  ## Analysis steps

  ### 1. Identify the current wave
  Use `get_daily_history` to fetch roughly the last 120 days, combined with `analyze_trend` trend data:

  **Impulse wave (1-3-5) characteristics**:
  - Wave 1: the first leg of a trend reversal, with volume expanding moderately.
  - Wave 3: the strongest impulse wave, usually with expanding volume and a strong MACD; it is never
    the shortest wave.
  - Wave 5: volume is often weaker than in wave 3; a top divergence here signals the move is about to end
    after one more push higher.

  **Corrective wave (A-B-C) characteristics**:
  - Wave A: the first decline, with relatively heavy volume — most people mistake it for a pullback.
  - Wave B: a bounce, weaker than the prior rally, with shrinking volume — a high-risk bull trap.
  - Wave C: the second decline, usually stronger than wave A, completing the correction.

  ### 2. Judge the golden-ratio levels
  - The wave-2 pullback is usually 38.2%-61.8% of wave 1.
  - The wave-3 target is usually a 1.618-2.618x extension of wave 1.
  - Wave 4 must not enter wave 1's price territory (a violation of wave rules).
  - Wave C target: measured from wave A's top, equal to or exceeding wave A's length.

  ### 3. Optimal buy points
  - **Wave-2 pullback stabilizes** (the "golden pit"): the safest buy point, stop-loss at wave 1's start.
  - **Wave-4 pullback stabilizes**: second-best, stop-loss at wave 1's top.
  - **Early wave-3 breakout**: a high-volume breakout above wave 1's high.
  - Avoid chasing strength near the end of wave 5 (top-divergence risk).

  ### 4. Risk notes
  - Don't take a heavy position on a wave-B bounce (it's a trap by nature).
  - Wave counting is inherently subjective and should be verified against other technical indicators.
  - If a wave rule is violated (e.g. wave 4 intrudes into wave 1), recount the waves.

  ### 5. Output requirements
  - State the likely current wave position (e.g. "in the middle of wave 3" or "possibly a wave-4 correction").
  - Give the key Fibonacci support/resistance levels (0.382/0.618/1.618).
  - State whether now is a buying opportunity, a time to wait, or a time to avoid.
  - Note the confidence level of the wave count (high/medium/low).

  Suggested score adjustments:
  - Wave-2 bottom stabilizes (golden pit): `sentiment_score +15`
  - Wave-3 breakout confirmed: `sentiment_score +12`
  - End of wave 5 / top divergence: `sentiment_score -10`
  - In a wave-C decline: `sentiment_score -12`
