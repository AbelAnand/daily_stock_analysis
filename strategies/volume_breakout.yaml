# Volume Breakout Strategy
# Price breaks above resistance on heavy volume (>2x average).

name: volume_breakout
display_name: Volume Breakout
description: Detects a high-volume breakout through resistance. Applicable when price is approaching a known resistance level.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [volume breakout, breakout]
default_priority: 30
market_regimes: [trending_up]

instructions: |
  **Volume Breakout Strategy**

  Breakout criteria:

  1. **Identify resistance**:
     - Use `analyze_trend` -> resistance_levels to get the resistance level.
     - Usually the 20-day high or the top of a prior consolidation range.

  2. **Volume confirmation** (relates to core rule 3: efficiency first):
     - The day's volume > 2x the 5-day average volume.
     - Confirm with `get_realtime_quote` -> volume_ratio > 2.0.
     - Cross-check with `get_daily_history` to compute the average volume.

  3. **Price confirmation** (relates to core rule 1: strict entry):
     - The close must be above the resistance level.
     - The close should be in the upper 30% of the day's range (a strong close).
     - Post-breakout bias check: still needs to be < 5% to avoid chasing strength.

  4. **Follow-through verification** (if data is available):
     - The next day's open should be above the breakout level, to distinguish a real breakout from a fake one.

  5. **Risk filter** (relates to core rule 5: risk screening):
     - Use `search_stock_news` to check for no major bad news.
     - PE should not be excessive (avoid a bubble-driven breakout).

  Suggested score adjustments:
  - Volume breakout confirmed: sentiment_score +12
  - Breakout accompanied by sector resonance (the sector is also strong): an additional +5
  - Set the ideal buy point near the breakout level, with the stop-loss 3% below it.
  - Note "volume breakout" in `buy_reason` and `volume_analysis`.
