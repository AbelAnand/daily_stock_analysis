# Expectation Repricing Strategy

name: expectation_repricing
display_name: Expectation Repricing
description: Analyzes shifts in earnings, policy, and valuation expectations to find expectation-gap repair opportunities or the pullback risk after expectations overheat.
category: framework
core_rules: [3, 5, 6]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_realtime_quote
  - analyze_trend
aliases: [expectations, expectation gap, expectation repricing]
default_priority: 65
market_regimes: [volatile, sector_hot]

instructions: |
  **Expectation Repricing Strategy**

  Applicable scenarios:
  - Market expectations about the company's earnings, policy, industry conditions, valuation level, or
    competitive landscape are shifting.
  - Need to judge whether the current price reflects "expectation repair," "expectation disappointment,"
    or "expectation overheating."

  Analysis framework:

  1. **Source of the expectation**
     - Use `search_stock_news` to identify recent information that has shifted market expectations:
       earnings preannouncements, analyst views, orders, policy, product progress, industry data.
     - Distinguish hard information (announcements, financial reports, orders) from soft information
       (rumors, opinions, sentiment).

  2. **Direction of the expectation gap**
     - Positive gap: the market was previously pessimistic, and new information shows the business or
       results are better than expected.
     - Negative gap: the market was previously optimistic, and new information falls short of expectations
       or fails to verify.
     - If the information has already been fully reflected by a sustained rally, flag the payoff risk.

  3. **Valuation repricing**
     - Use PE/PB, market cap, ROE, cash flow, etc. to judge whether the valuation repricing has fundamental support.
     - A valuation increase needs to be matched by earnings quality, growth durability, and industry headroom.
     - When valuation pulls back, check whether it's driven by a one-off disturbance or a longer-term change in thesis.

  4. **Price confirmation**
     - Use `analyze_trend` to judge whether the shift in expectations has already turned into a trend.
     - A high-volume breakout can be read as the expectation being confirmed by money flow; a low-volume
       bounce leans more toward a repair-watch case.
     - Stalling on high volume at highs, no reaction to good news, or breaking below key support may
       signal the expectation is weakening.

  Output requirements:
  - State clearly whether the current situation is: a positive expectation gap / expectation already paid
    off / a negative expectation gap / expectation unclear.
  - State which pieces of information shifted market expectations and which are still unverified.
  - Give watch points: the next earnings report, order fulfillment, policy rollout, a valuation pullback,
    or technical confirmation.

  Suggested score adjustments:
  - A positive expectation gap not yet fully reflected in price: `sentiment_score +15`
  - A positive expectation gap already paid off by a sustained rally: `sentiment_score -5`
  - A negative expectation gap or a core assumption disproven: `sentiment_score -15`
  - Insufficient information but a potential repair exists: stay neutral and lower confidence
