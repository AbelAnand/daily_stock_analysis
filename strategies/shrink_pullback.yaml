# Shrink Volume Pullback Strategy
# Volume shrinks during pullback to MA5/MA10, then price bounces.

name: shrink_pullback
display_name: Shrink-Volume Pullback
description: Detects a low-volume pullback to moving-average support, an ideal entry point for trend continuation.
category: trend
core_rules: [1, 2, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [shrink volume pullback, pullback]
default_router: true
default_priority: 40
market_regimes: [trending_down, sideways]

instructions: |
  **Shrink-Volume Pullback Strategy**

  Entry criteria:

  1. **Precondition** (relates to core rule 2: trend trading):
     - The stock must be in an uptrend (MA5 > MA10 > MA20).
     - Use `analyze_trend` to confirm bullish alignment.

  2. **Detecting the pullback** (relates to core rule 4: buy-point preference):
     - Use `get_daily_history` and `get_realtime_quote`.
     - Price pulls back to near MA5 (within 1%) or near MA10 (within 2%).
     - Volume during the pullback < 70% of the 5-day average (the shrink-volume signature).
     - `analyze_trend` -> volume_status should show shrinking volume.

  3. **Bounce signal** (relates to core rule 1: strict entry):
     - The current price holds above the moving-average support level.
     - MA5 bias < 2% -- the ideal buy zone.

  4. **Confirming conditions** (relates to core rule 5: risk screening):
     - `search_stock_news` shows no bad news.
     - The chip distribution is healthy (profit ratio 50-80%).

  Suggested score adjustments:
  - Low-volume pullback to MA5: sentiment_score +10
  - Low-volume pullback to MA10 with volume < 0.6x the average: sentiment_score +8
  - Set the ideal buy point at the MA5 level, the second-best buy point at MA10.
  - Set the stop-loss at the MA20 level.
  - Note "shrink-volume pullback" in `buy_reason`.
