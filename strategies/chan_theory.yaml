# Chan Theory Strategy
# Based on Zen channel theory: pen, stroke, segment, hub structure analysis.

name: chan_theory
display_name: Chan Theory
description: Uses Chan Theory's pen/segment/hub structure to judge trend degree, buy/sell points, and divergence signals.
category: framework
core_rules: [1, 2, 3, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [chan theory, chan theory analysis]
default_priority: 70
market_regimes: [volatile]

instructions: |
  **Chan Theory (Zen Channel Theory)**

  Core framework: fractal -> pen -> segment -> hub -> trend

  ## Analysis steps

  ### 1. Determine the price structure (hub identification)
  - Use `get_daily_history` to fetch roughly the last 60 daily bars.
  - Identify the sequence of recent highs and lows to judge whether price is currently
    in a **consolidation hub** (one or more hubs) or a **trend leg** (moving away from the hub, up or down).
  - Hub: the overlapping range of 3 consecutive legs, where price oscillates repeatedly within that range.
  - Trend: 3 consecutive same-degree hubs all moving in the same direction.

  ### 2. Judge divergence (the highest-priority signal)
  - **Top divergence**: price makes a new high but the MACD red-bar area shrinks -> a sell/reduce signal.
  - **Bottom divergence**: price makes a new low but the MACD green-bar area shrinks -> a buy/add signal.
  - Use `analyze_trend` to get MACD data and compare it against the price highs/lows.

  ### 3. Determine the buy/sell point
  - **1st buy point** (strongest): within a downtrend, the last hub shows bottom divergence.
  - **2nd buy point**: the first pullback after leaving a downtrend hub that does not break below the hub's high.
  - **3rd buy point**: an upward breakout after hub consolidation (without returning into the hub).
  - **1st/2nd/3rd sell point**: the mirror structure, opposite direction.
  - The current buy/sell point level determines position size.

  ### 4. Degree and position size
  - A daily-degree buy/sell point can carry a heavier position (30-50%).
  - A weekly-degree buy/sell point can carry a larger position (50-80%).
  - Multi-degree resonance (daily + weekly aligned) gives the strongest signal.

  ### 5. Output requirements
  - State clearly whether price is currently in: an uptrend / a downtrend / hub consolidation.
  - Note whether a divergence signal exists and at what degree.
  - Give the current buy/sell point type (1st/2nd/3rd buy point, etc.); if none, write "no clear buy/sell point yet."
  - Set the stop-loss at the prior low (when buying) or the prior high (when selling).

  Suggested score adjustments:
  - Bottom divergence + 1st buy point signal: `sentiment_score +15`
  - 2nd/3rd buy point resonance: `sentiment_score +10`
  - Hub consolidation with no clear direction: `sentiment_score stays at baseline`
  - Top divergence / downtrend: `sentiment_score -15`
