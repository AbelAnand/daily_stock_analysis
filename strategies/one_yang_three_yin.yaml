# One Yang Three Yin Strategy
# K-line pattern: bullish → 3 small bearish → bullish. Consolidation end signal.

name: one_yang_three_yin
display_name: One Yang Three Yin
description: Detects the "one yang candle flanked by three yin candles" consolidation pattern, a trend-continuation entry signal.
category: pattern
core_rules: [2, 4]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [one yang through three yin, one yang three yin]
default_priority: 110

instructions: |
  **One Yang Three Yin Strategy**

  Pattern definition (over the last 5 trading days):

  1. **Day 1**: a large bullish (yang) candle (close > open, body > 2% of the stock price).
  2. **Days 2-4**: three consecutive bearish (yin) candles or small-bodied candles:
     - Each candle's low must not break below day 1's open.
     - Volume should shrink progressively (volume ratio < 0.8).
     - All three candles should close within day 1's body range.
  3. **Day 5**: another bullish candle whose close breaks above day 1's close.

  How to evaluate with the tools:

  1. Use `get_daily_history` to fetch the last 10 days of data.
  2. Check whether the last 5 candles match the pattern above.
  3. Use `analyze_trend` to confirm bullish alignment (relates to core rule 2: trend trading,
     MA5 > MA10 > MA20).

  Suggested score adjustments:
  - Pattern confirmed + bullish trend: sentiment_score +15
  - Pattern confirmed but trend unclear: sentiment_score +5
  - Note "one yang three yin" in `pattern_analysis` and `buy_reason`.
  - Set the ideal buy point near day 5's close, with the stop-loss below day 1's open.
