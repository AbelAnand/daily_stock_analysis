# Box Range Trading Strategy
# Buy at box support, sell at box resistance, profit from range-bound oscillation.

name: box_oscillation
display_name: Box Range Oscillation
description: Identifies a price box (trading range) and buys near the floor, trims near the ceiling; suited to sideways, range-bound markets.
category: framework
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [box range, box oscillation]
default_priority: 50
market_regimes: [sideways]

instructions: |
  **Box Range Trading Strategy**

  Core logic: inside the box, price repeatedly oscillates between resistance and support —
  "buy near support, sell near resistance" — capturing range-bound gains through swing trades.

  ## Analysis steps

  ### 1. Identify the box
  Use `get_daily_history` to fetch roughly the last 60-120 days:

  - **Box ceiling (resistance)**: a line connecting recent highs that have been touched
    repeatedly but not decisively broken. Usually a cluster of 3+ highs within a 20-60 day window.
  - **Box floor (support)**: a line connecting recent lows that have been probed
    repeatedly but not decisively broken.
  - Box validity: both the ceiling and floor must each be touched at least 2-3 times to confirm.
  - Use the `support_levels` / `resistance_levels` from `analyze_trend` to help locate them.

  ### 2. Judge the current position
  Use `get_realtime_quote` to get the current price and compare it against the box boundaries:

  - **Near the floor** (within 5% of support): buy/add signal; set the stop 3% below the floor.
  - **Middle of the box** (the middle third): stand by, no active trade.
  - **Near the ceiling** (within 5% of resistance): trim/take-profit signal; don't chase strength.

  ### 3. Volume-assisted judgment
  - **Volume surge + stabilization at the floor**: a strong signal that support is holding; can size up.
  - **Shrinking volume + stalling at the ceiling**: a sell signal that resistance is holding.
  - **Box breakout (volume more than 2x the average)**:
    - A decisive breakout upward -> switch to the bull-trend strategy; new target = box height projected upward.
    - A decisive breakdown below -> exit and wait; the old support becomes resistance.

  ### 4. Box width and expected return
  - Compute box width: (ceiling - floor) / floor x 100%.
  - Width < 5%: too little room to trade; not recommended.
  - Width 5%-15%: a standard box; swing trading is workable.
  - Width > 15%: a wide box; larger swings are possible.

  ### 5. Identifying false breakouts
  - An intraday touch of resistance/support that quickly reverses and closes back inside the box ->
    a false breakout; keep trading the box.
  - Two consecutive closes beyond the box boundary with rising volume -> a real breakout; revise the strategy.

  ### 6. Output requirements
  - State the box ceiling and floor prices explicitly.
  - State which zone the current price sits in (floor / middle / ceiling).
  - If price has broken out, state the breakout direction and new target.
  - Suggested position size and stop-loss level.

  Suggested score adjustments:
  - Stabilizes at the floor + shrinking volume: `sentiment_score +10`
  - Volume surge pushing off the floor: `sentiment_score +12`
  - Decisive upward breakout of the box: `sentiment_score +15, switch to trend strategy`
  - Sitting in the ceiling zone: `sentiment_score -5 (don't chase strength)`
  - Decisive breakdown below the floor: `sentiment_score -15, exit`
