# Event Driven Strategy

name: event_driven
display_name: Event Driven
description: Evaluates catalyst strength, the probability of payoff, and risk boundaries around events such as earnings, policy, M&A, orders, and product launches.
category: framework
core_rules: [3, 5]
required_tools:
  - search_stock_news
  - get_realtime_quote
  - analyze_trend
aliases: [event driven, catalyst, catalyst event]
default_priority: 45
market_regimes: [sector_hot, volatile]

instructions: |
  **Event Driven Strategy**

  Applicable scenarios:
  - The company or industry has a clear event catalyst — e.g. an earnings preannouncement, a won order,
    M&A/restructuring, a policy rollout, a product launch, a regulatory penalty, litigation, etc.
  - Need to judge whether the event is a short-term trading catalyst, a long-term fundamental improvement,
    or good news already priced in.

  Analysis framework:

  1. **Event classification**
     - Use `search_stock_news` to sort out the key recent events.
     - Classify events into: earnings, policy, orders/products, capital operations, regulatory/risk.
     - Pin down when each event occurred; stale or undated information should not be a primary basis.

  2. **Impact path**
     - Judge whether the event affects revenue, margin, valuation, financing capacity, market share, or only sentiment.
     - For major orders or policy tailwinds, state the payoff timeline and its uncertainty.
     - For regulatory actions, share reductions, penalties, litigation, etc., risk takes priority.

  3. **Market reaction**
     - Use `get_realtime_quote` and `analyze_trend` to judge whether the event is already fully priced in.
     - A high-volume rally that hasn't cleared key resistance can wait for confirmation.
     - Stalling on high volume at highs, or a pop-and-fade after good news, signals payoff pressure — be cautious.

  4. **Trading plan**
     - Before the event pays off, emphasize position control and the time window.
     - After the event pays off, reassess whether to switch from "trading the expectation" to "verifying the results."
     - For negative events, first check whether the risk has been sufficiently released before considering a rebound.

  Output requirements:
  - State the nature of the event clearly: positive / negative / neutral / uncertain.
  - Give the event's credibility, payoff timeline, and how much is already priced in.
  - The trading recommendation must include an invalidation condition, e.g. the announcement misses expectations,
    price breaks below key support, or the event's momentum fades.

  Suggested score adjustments:
  - A high-credibility positive event not yet fully priced in: `sentiment_score +14`
  - A positive event that has already largely paid off: `sentiment_score -6`
  - A negative event still unfolding: `sentiment_score -15`
  - The event's impact is unclear or the information conflicts: stay neutral and lower confidence
