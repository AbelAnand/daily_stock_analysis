# Bottom Volume Surge Strategy
# After extended decline, price stabilizes and volume spikes. Potential reversal.

name: bottom_volume
display_name: Bottom Volume Surge
description: Detects a volume-surge signal at the bottom after a prolonged decline, a potential trend-reversal signal.
category: reversal
core_rules: [2, 5]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [capitulation bottom, bottom volume surge]
default_priority: 60
market_regimes: [trending_down]

instructions: |
  **Bottom Volume Surge Strategy**

  Reversal criteria:

  1. **Confirm the sustained decline**:
     - Use `get_daily_history` (30 days).
     - Price has fallen > 15% from its 20-day high to the recent low.
     - `analyze_trend` -> trend_status should be BEAR or STRONG_BEAR.

  2. **Volume anomaly**:
     - The day's volume > 3x the 5-day average volume.
     - Use `get_realtime_quote` -> volume_ratio > 3.0.
     - This spike should follow a period of extremely low volume.

  3. **Price stabilization**:
     - The day's candle closes green (close > open).
     - Price holds above the recent low.
     - Ideally with a long lower wick, showing buyer support.

  4. **Confirming factors** (relates to core rule 5: risk screening):
     - Use `search_stock_news` to check for a fundamental catalyst.
     - Chip distribution: average cost is close to the current price (cost convergence).

  5. **Risk notes** (relates to core rule 2: trend trading):
     - This is a reversal signal, higher risk than trend-following.
     - Recommend a small position (at most 20-30%).
     - The stop-loss must be strict (placed below the recent low).

  Suggested score adjustments:
  - Bottom volume surge confirmed: sentiment_score +8
  - Combined with a green candle + news catalyst: an additional +5
  - Note "bottom volume surge" in `buy_reason` and `pattern_analysis`.
  - Set the stop-loss at the recent low.
