# Default Bull Trend Strategy

name: bull_trend
display_name: Default Bull Trend
description: Default preferred strategy for individual-stock analysis; identifies bullish alignment, trend continuation, and buy-the-dip opportunities.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [trend, trend analysis, bull trend]
default_active: true
default_router: true
default_priority: 10
market_regimes: [trending_up]

instructions: |
  **Default Bull Trend Strategy**

  Applicable scenarios:
  - The default strategy for routine individual-stock analysis.
  - Prioritizes opportunities where "the trend is up, risk is controlled, and the price isn't overextended."

  Analysis framework:

  1. **Trend confirmation (highest priority)**
     - Use `analyze_trend` to check the MA5/MA10/MA20 alignment.
     - MA5 >= MA10 >= MA20 with MA20 sloping upward is treated as a bullish structure.
     - If price breaks meaningfully below MA20, lower the bullish weighting.

  2. **Position and timing**
     - Prefer "pulls back but holds" over "chasing strength at highs."
     - When price is too far from MA5/MA10, flag waiting for a pullback.
     - A high-volume breakout through solid resistance can raise the win-rate rating.

  3. **Volume/price confirmation**
     - Use `get_daily_history` to check whether the breakout day / rebound day came with rising volume.
     - Be cautious of a rally on shrinking volume; watch for divergence if volume rises without price follow-through.

  4. **Trading recommendation output**
     - Output a clear buy/watch/reduce bias and its trigger condition.
     - Must give a stop-loss reference (e.g., below MA20 or a structural low) and a target, and compute the reward:risk ratio from these.
     - Only write "hold off for now" when expected value is negative or R < 1.5, and even then must state the flip condition
       (the specific price level or event that would flip it to buy/reduce) — avoid open-ended "wait and see" with no basis.

  Suggested score adjustments:
  - Bullish alignment + solid trend strength: `sentiment_score +12`
  - Stabilizes after pulling back to a key moving average: `sentiment_score +8`
  - High-volume breakout through key resistance: `sentiment_score +10`
  - Breaks below MA20 or trend weakens: `sentiment_score -12`
