# MA Golden Cross Strategy
# MA5 crosses above MA10 (or MA10 above MA20) with volume confirmation.

name: ma_golden_cross
display_name: MA Golden Cross
description: Detects a moving-average golden cross with volume confirmation — a classic trend reversal/continuation signal.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [ma golden cross, golden cross]
default_priority: 20
market_regimes: [trending_up]

instructions: |
  **MA Golden Cross Strategy**

  Signal criteria:

  1. **Detect the golden cross** (relates to core rule 2: trend trading):
     - Use `analyze_trend` to check the moving-average alignment and MACD status.
     - Primary signal: MA5 crosses above MA10 within the last 3 trading days.
     - Strong signal: MA10 crosses above MA20 (slower but more reliable).
     - Check whether MACD shows a golden cross, or a golden cross above the zero line.

  2. **Volume confirmation** (relates to core rule 3: efficiency first):
     - Volume on the cross day should exceed the 5-day average volume.
     - Verify with `get_daily_history`.
     - A volume ratio > 1.2 on the cross day is a positive signal.

  3. **Trend context**:
     - A golden cross after consolidation: the strongest signal.
     - A golden cross within an uptrend: a continuation signal.
     - A golden cross during a deep decline: a weak signal, needs more confirmation.

  4. **Price position** (relates to core rule 1: strict entry):
     - Price should be near or above the crossing moving averages.
     - Bias < 5% -- avoid a delayed entry chasing strength.

  Suggested score adjustments:
  - MA5 x MA10 golden cross with volume confirmation: sentiment_score +10
  - MA10 x MA20 golden cross: sentiment_score +8
  - MACD golden cross above the zero line: an additional +5
  - Note "MA golden cross" in `ma_analysis` and `buy_reason`.
  - Set the ideal buy point near the level of the crossing moving averages.
