# Hot Theme Strategy

name: hot_theme
display_name: Hot Theme
description: Tracks policy, industry, and market hot spots to judge theme strength, sector spread, and a stock's relative strength within it.
category: framework
core_rules: [2, 3, 5, 7]
required_tools:
  - get_sector_rankings
  - search_stock_news
  - get_realtime_quote
  - analyze_trend
aliases: [hot spot, theme, hot theme]
default_priority: 35
market_regimes: [sector_hot]

instructions: |
  **Hot Theme Strategy**

  Applicable scenarios:
  - The market has a clear policy, industry, technology-roadmap, or crowded-money hot spot.
  - Need to judge whether the stock is genuinely benefiting from the theme rather than just riding the concept.

  Analysis framework:

  1. **Theme strength**
     - Use `get_sector_rankings` to judge whether the related sector is among the recent leaders by gain,
       turnover value, or attention.
     - Watch whether the theme is spreading from a few core stocks to many stocks within the sector.
     - If only a single stock is moving and the sector isn't resonating, lower the signal weight.

  2. **Stock relevance**
     - Use `search_stock_news` to check whether the company's business, orders, capacity, customers, or
       filings are directly related to the theme.
     - Distinguish "substantive beneficiary" from "indirect beneficiary" from "weak conceptual link."
     - When the conceptual link is weak but the gain is already large, flag the risk of the theme paying off.

  3. **Relative strength**
     - Use `get_realtime_quote` and `analyze_trend` to judge whether the stock's gain, volume ratio, and
       turnover are stronger than the sector average.
     - A genuinely strong theme stock typically shows rising volume, active turnover, and pullbacks that
       hold above key moving averages.

  4. **Timing and risk**
     - Don't chase strength during continuous acceleration or at a high-bias level.
     - If news is dominated by "already rallied a lot," "money is piling in," or "hot-money games on the
       dragon-tiger list," watch for a short-term sentiment top.
     - Major bad news, a regulatory inquiry, or a clarification announcement can single-handedly lower the rating.

  Output requirements:
  - State clearly which phase the theme is in: ignition / spreading / diverging / fading.
  - State the stock's substantive relevance to the theme.
  - Give actionable trigger conditions: a pullback that holds, a high-volume breakout, continued sector
    resonance, or a stop-loss if the theme fades.

  Suggested score adjustments:
  - The theme is igniting or spreading and the stock substantively benefits: `sentiment_score +12`
  - The stock is stronger than the sector with volume confirmation: an additional `+6`
  - The theme is diverging or fading: `sentiment_score -8`
  - Only riding the concept with an excessive bias: `sentiment_score -12`
